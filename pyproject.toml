[project]
name = "histbias-probe"
dynamic = ["version"]
description = "Test how LLMs handle censorship and historical politics, scored by a judge model."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlmodel>=0.0.22",
    "alembic>=1.14",
    "jinja2>=3.1",
    "pydantic-settings>=2.6",
    "typer>=0.15",
    "httpx>=0.28",
    "cryptography>=44",
    "pyyaml>=6.0",
    "python-multipart>=0.0.20",
    "markdown-it-py>=4.3.0",
    "nh3>=0.3.8",
]

[project.scripts]
histbias = "app.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "respx>=0.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "app/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"
filterwarnings = [
    "error::DeprecationWarning:app.*",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
