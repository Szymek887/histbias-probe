{% extends "base.html" %}
{% block content %}
<header class="page-head">
  <div>
    <h1>Topics</h1>
    <p class="meta">The question bank. Tick topics to start a run with them or to export them.</p>
  </div>
  <p class="page-actions">
    <a href="/countries">Countries</a>
    <a href="/topics/import" role="button" class="secondary">Import</a>
    <a href="/topics/export" role="button" class="secondary">Export all</a>
    <a href="/topics/new" role="button">New topic</a>
  </p>
</header>

<form id="topic-filters" method="get" action="/topics"
      hx-get="/topics" hx-target="#topic-table" hx-push-url="true"
      hx-trigger="input delay:300ms, change">
  <div class="filters">
    <input type="search" name="q" value="{{ filters.q }}" placeholder="Search title or slug" aria-label="Search">
    <select name="country" aria-label="Country">
      <option value="">All countries</option>
      {% for c in countries %}<option value="{{ c.code }}"{% if c.code == filters.country %} selected{% endif %}>{{ c.name }} ({{ c.code }})</option>{% endfor %}
    </select>
    <select name="era" aria-label="Era">
      <option value="">All eras</option>
      {% for e in eras %}<option value="{{ e.value }}"{% if e.value == filters.era %} selected{% endif %}>{{ era_labels[e.value] }}</option>{% endfor %}
    </select>
    <select name="type" aria-label="Type">
      <option value="">All types</option>
      {% for t in types %}<option value="{{ t.value }}"{% if t.value == filters.type %} selected{% endif %}>{{ type_labels[t.value] }}</option>{% endfor %}
    </select>
    <label><input type="checkbox" name="archived" value="true"{% if filters.archived %} checked{% endif %}> Show archived topics instead</label>
  </div>
  <noscript><button type="submit">Filter</button></noscript>
</form>

<form method="get" id="topic-selection">
  <div id="topic-table">{% include "topics/_table.html" %}</div>
  <p class="actions">
    <button type="submit" formaction="/runs/new">Start run with selected</button>
    <button type="submit" formaction="/topics/export" class="secondary">Export selected</button>
  </p>
</form>
{% endblock %}
