<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ page_title }}{% endblock %} · HistBias Probe</title>
  <link rel="preload" href="{{ url_for('static', path='fonts/public-sans-latin-wght-normal.woff2') }}" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{ url_for('static', path='fonts/source-serif-4-latin-wght-normal.woff2') }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ url_for('static', path='app.css') }}?v={{ app_version }}">
  <script src="{{ url_for('static', path='htmx.min.js') }}?v={{ app_version }}" defer></script>
</head>
<body hx-headers='{"X-CSRF-Token": "{{ csrf_token }}"}'>
  <header class="topbar">
    <nav aria-label="Main">
      <ul>
        <li><a class="brand" href="/" aria-label="HistBias Probe, home">HistBias <span class="brand-bar">Probe</span></a></li>
      </ul>
      <ul>
        {% for item in nav_items %}
        <li><a href="{{ item.href }}"{% if item.key == active_nav %} aria-current="page"{% endif %}>{{ item.label }}</a></li>
        {% endfor %}
      </ul>
    </nav>
  </header>
  <main>
    {% if notice %}<p role="status" class="notice">{{ notice }}</p>{% endif %}
    {% block content %}{% endblock %}
  </main>
  <footer class="site">
    <small>HistBias Probe {{ app_version }} · runs locally on this computer</small>
  </footer>
</body>
</html>
