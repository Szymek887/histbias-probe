{% macro csrf() -%}
<input type="hidden" name="{{ csrf_field }}" value="{{ csrf_token }}">
{%- endmacro %}

{% macro errors_box(errors) -%}
{% if errors %}
<article class="errors" role="alert">
  <strong>Please fix the following:</strong>
  <ul>{% for e in errors %}<li>{{ e }}</li>{% endfor %}</ul>
</article>
{% endif %}
{%- endmacro %}

{% macro post_button(action, label, confirm=None, secondary=False) -%}
<form method="post" action="{{ action }}" class="inline"{% if confirm %} onsubmit="return confirm({{ confirm|tojson|forceescape }})"{% endif %}>
  {{ csrf() }}
  <button type="submit"{% if secondary %} class="secondary"{% endif %}>{{ label }}</button>
</form>
{%- endmacro %}
