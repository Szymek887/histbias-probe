# Preset providers and models. NO SECRETS HERE - keys are added in the UI (Settings -> API keys).
# Verified against official provider docs on 2026-11-24 (M2); sources in docs/06-providers.md.
# Model IDs change often: they stay editable in the UI. model_id: "" means the user must fill
# it in before the model can be enabled. Re-loading presets never overwrites existing rows.
version: 1
providers:
  - name: Anthropic
    kind: anthropic
    base_url: https://api.anthropic.com
    models:
      - {display_name: Claude Sonnet 5.5, model_id: claude-sonnet-5-5, country: US}

  - name: DeepSeek
    kind: openai_compatible
    base_url: https://api.deepseek.com
    extra: {supports_json_mode: true}
    models:
      # deepseek-chat was announced for discontinuation (2026-07-24) and is no longer listed.
      - {display_name: DeepSeek, model_id: deepseek-flash, country: CN, notes: "DeepSeek-V4.1-Flash. The study used the DeepSeek chat app."}
      - {display_name: DeepSeek V4 Pro, model_id: deepseek-v4-pro, country: CN}

  - name: Baidu Qianfan
    kind: openai_compatible
    base_url: https://qianfan.baidubce.com/v2
    extra: {supports_json_mode: true}
    models:
      - {display_name: ERNIE (Baidu), model_id: ernie-5.1, country: CN, notes: "The study used the Wenxin consumer app. Key format: bce-v3/ALTAK-…"}

  - name: Yandex AI Studio
    kind: openai_compatible
    base_url: https://ai.api.cloud.yandex.net/v1
    extra:
      auth_prefix: Api-Key
      secret_extra_fields: [folder_id]
      extra_headers: {OpenAI-Project: "{folder_id}", x-folder-id: "{folder_id}"}
    models:
      - {display_name: Alice AI (Yandex), model_id: "gpt://{folder_id}/aliceai-llm", country: RU}
      - {display_name: YandexGPT Pro 5.1, model_id: "gpt://{folder_id}/yandexgpt-5.1", country: RU}

  - name: GigaChat
    kind: gigachat
    base_url: https://api.giga.chat/v1
    extra:
      oauth_url: https://ngw.devices.sberbank.ru:9443/api/v2/oauth
      scope: GIGACHAT_API_PERS          # or GIGACHAT_API_B2B / GIGACHAT_API_CORP
      ca_bundle_path: ""                # path to the Russian Trusted Root CA (PEM), see docs/06-providers.md
    models:
      - {display_name: GigaChat 2 Max, model_id: GigaChat-2-Max, country: RU}

  - name: Mistral
    kind: openai_compatible
    base_url: https://api.mistral.ai/v1
    extra: {supports_json_mode: true}
    models:
      - {display_name: Mistral Large, model_id: mistral-large-latest, country: FR, notes: "Points to Mistral Large 4 (always reasons). The study's Le Chat app ran a different backend."}

  - name: xAI
    kind: openai_compatible
    base_url: https://api.x.ai/v1
    extra: {supports_json_mode: true, max_tokens_field: max_completion_tokens}
    models:
      - {display_name: Grok, model_id: grok-4.7, country: US}

  - name: Hugging Face
    kind: openai_compatible
    base_url: https://router.huggingface.co/v1
    models:
      # No Falcon Arabic model is served by any HF inference provider (checked 2026-11-24).
      - {display_name: Falcon Arabic, model_id: "", country: ARAB, notes: "Not available on the HF router; run it locally (vLLM/Ollama) and point a provider at it."}

  - name: Local Ollama
    kind: openai_compatible
    base_url: http://localhost:11434/v1
    extra: {no_auth: true, supports_json_mode: true}
    models:
      - {display_name: Bielik, model_id: "SpeakLeash/bielik-11b-v3.1-instruct:Q4_K_M", country: PL, notes: "ollama pull SpeakLeash/bielik-11b-v3.1-instruct:Q4_K_M"}
      - {display_name: Control (uncensored open weights), model_id: "", country: null}

  - name: Mock
    kind: mock
    base_url: ""
    extra: {no_auth: true}
    models:
      - {display_name: Mock Echo, model_id: mock-echo, country: null}
      - {display_name: Mock Random, model_id: mock-random, country: null}
      - {display_name: Mock Refuser, model_id: mock-refuse, country: null}
      - {display_name: Mock Judge, model_id: mock-judge, country: null}
