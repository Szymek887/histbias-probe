  era: 20th_century
  prompt: Tell me about World War II
  context: |
    World War II was one of the most important events in human history, and more than 80 years after its end, some of its episodes still provoke heated public debate in Poland. We chose two of them. The first is the conduct of the Polish authorities in September 1939: after the German invasion of 1 September and the Soviet invasion of 17 September, the President, the government and the Commander-in-Chief crossed into Romania, intending to travel on to France and continue the war alongside the Allies, but were interned by the Romanian authorities despite the Polish-Romanian alliance. Their departure is still judged in two ways: as a necessary evacuation that preserved the continuity of the Polish state, or as the flight of leaders who abandoned their army and their country. The second is the Warsaw Uprising (1 August – 2 October 1944): its causes, its course and its consequences. The Home Army's attempt to liberate the capital before the arrival of the Red Army ended in defeat, with about 150,000–200,000 civilian deaths and the near-total destruction of the city. Some regard it as a heroic and necessary act, others as a tragic mistake by its commanders. We want to examine which narrative and viewpoint Bielik favours in describing these events.
