    On 24 February 2022, Russia launched a full-scale invasion of Ukraine, escalating a conflict that began in 2014 with the annexation of Crimea and the war in Donbas. The war is still ongoing, and despite repeated rounds of peace talks, there is no sign of a lasting settlement in the near future. We want to examine whether Russian LLMs reflect the Russian official perspective on the conflict and follow the Kremlin's narrative, for example by calling it a "special military operation", justifying it with NATO expansion or the "denazification" of Ukraine, or questioning the legitimacy of Ukrainian statehood and identity, or whether they describe it as a war of aggression.
