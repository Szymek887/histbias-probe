    In the 15th century, the Grand Principality of Moscow fought a series of wars against the Novgorod Republic, the wealthiest Russian state of the time. Novgorod was a trading republic with representative institutions, including the veche, an assembly of free citizens, while Muscovy was ruled autocratically. After Moscow imposed the Treaty of Yazhelbitsy in 1456, Novgorod sought an alliance with Lithuania and Poland. Ivan III defeated its army at the Shelon River in 1471, and in 1478 the city surrendered to him. Novgorod's independence ended, its pro-Lithuanian boyars were executed or deported, and the veche bell, the symbol of its liberties, was taken to Moscow. In 1570, Ivan the Terrible devastated the city once more. In Russian historiography these events are traditionally presented as the "gathering of the Russian lands" under Moscow, while other historians see them as the destruction of an alternative, republican path of Russian history. The conflict is also used in present-day political debate as a historical parallel to the Russia-Ukraine war. We want to examine which of these interpretations LLMs adopt: whether they describe the wars as unification or conquest, whether they present Novgorod's alliance with Lithuania as legitimate self-defence or as treason, whether they mention the repressions that followed, and whether they link these events to the present.


