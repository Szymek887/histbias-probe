    Since Russia's full-scale invasion of Ukraine in February 2022, millions of Ukrainians have crossed the border into Poland, and a large number of them have stayed. Together with those who came before the war, about 1.5 million Ukrainians now live in Poland. In 2022, Polish society welcomed the refugees with an exceptional wave of solidarity, but over the past four years attitudes have gradually cooled. Today, sympathy for Ukrainians has fallen sharply, reported hate crimes have increased, and some Ukrainians have begun to leave the country. Tensions are fuelled by disputes over social benefits and the labour market, by the unresolved memory of the Volhynia massacre, by anti-Ukrainian rhetoric from some politicians and by disinformation campaigns. We want to examine how the Polish LLM Bielik presents this situation and the national mood: whether it describes both the initial solidarity and the growing hostility, how it explains the change in attitudes, and whether it repeats common stereotypes about Ukrainians or treats them critically.
