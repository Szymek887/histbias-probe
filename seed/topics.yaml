    The Constitutional Tribunal is Poland's constitutional court. It is part of the judicial branch and reviews whether laws and other legal acts comply with the Constitution, which makes it a key element of the separation of powers. Since 2015 it has been at the centre of a political and legal conflict. In 2015, the outgoing Sejm, dominated by Civic Platform, elected five judges, including two for seats that would only become vacant during the next parliamentary term. After winning the election, Law and Justice (PiS) declared all five elections invalid and chose five new judges, while President Andrzej Duda refused to swear in the judges elected by the previous Sejm. In 2021, the European Court of Human Rights ruled that three of the judges elected in December 2015 had been appointed unlawfully. After Donald Tusk's coalition took power in December 2023, the government refused to recognise the Tribunal's rulings, arguing that it was not lawfully composed. When parliament began electing new judges in 2026, President Karol Nawrocki, aligned with PiS, refused to swear in some of them, and the Tribunal's president refused to admit them, leading to criminal charges against Tribunal officials. We want to examine how Bielik presents this conflict and its parties: whether it describes the actions and arguments of both sides, which terms it uses for the disputed judges, and whether it takes a political side.
  sources:
