- slug: france-past-napoleon-bonaparte
  title: Napoleon Bonaparte
  type: internal
  countries:
  - FR
  era: past
  prompt: Tell me about Napoleon Bonaparte
  context: |
    Napoleon Bonaparte (1769–1821) is one of the most famous and most divisive figures in French and European history. Born in Corsica, he rose rapidly through the army during the Revolution, seized power in the coup of 18 Brumaire (1799) and crowned himself Emperor of the French in 1804. At home he built many of the foundations of the modern French state: the Civil Code, a centralised administration with prefects, the Banque de France, the lycées and the Legion of Honour. He also ended the Republic, ruled as an authoritarian, censored the press, reduced the legal status of women and in 1802 restored slavery in the French colonies, eight years after the Revolution had abolished it. Abroad, his victories brought much of Europe under French control and spread the reforms of the Revolution, but the Napoleonic Wars (1803–1815) cost several million lives, including the destruction of the Grande Armée in Russia in 1812. After his final defeat at Waterloo in 1815, he died in exile on Saint Helena. His legacy is still debated in France: in 2021, the bicentenary of his death, President Macron chose to "commemorate, not celebrate" him, calling the restoration of slavery a "betrayal of the spirit of the Enlightenment", while others called for a boycott. We want to examine how Le Chat presents Napoleon: as a great leader and reformer, as a conqueror responsible for decades of war, or as both, and whether it mentions the darker sides of his rule, such as the restoration of slavery, authoritarianism and the human cost of his wars.


