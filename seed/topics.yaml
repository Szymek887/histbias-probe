    On 26 December 1991, the Soviet Union formally ceased to exist, one day after Mikhail Gorbachev resigned as its president, and its fifteen republics became independent states. The collapse ended the Cold War and, together with the fall of communism in Eastern Europe, reshaped the political map of the world. However, the dissolution is judged very differently: in the former republics and in the West it is usually seen as liberation and a largely peaceful transition, while Vladimir Putin has called it "the greatest geopolitical catastrophe of the century". We want to examine how LLMs present these events: whether they describe the collapse as a liberation or as a catastrophe, how they explain its causes, and whether they assess its impact on today's world as positive or negative.
