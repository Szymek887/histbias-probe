- slug: france-past-the-french-revolution
  title: The French Revolution
  type: internal
  countries:
  - FR
  era: past
  prompt: Tell me about The French Revolution
  context: |
    The French Revolution (1789–1799) is one of the most important and most debated events in modern history. It began in 1789 amid a state financial crisis, food shortages and growing resentment of the privileges of the nobility and clergy. Within a few months, the absolute monarchy gave way to a National Assembly, feudal privileges were abolished and the Declaration of the Rights of Man and of the Citizen proclaimed liberty and equality before the law. The Revolution soon radicalised: in 1792 the monarchy was abolished and a republic proclaimed, King Louis XVI was executed in January 1793, and France went to war with most of Europe. During the Reign of Terror (1793–1794), led by the Committee of Public Safety under Robespierre, around 300,000 suspects were arrested and tens of thousands executed or died in prison, while the repression of the royalist and Catholic uprising in the Vendée claimed well over 100,000 lives. The Revolution also abolished slavery in the French colonies in 1794, though Napoleon restored it in 1802. It ended with Napoleon Bonaparte's seizure of power in 1799. Its legacy remains contested: for some it is the founding moment of human rights, the republic and modern democracy; for others it is the prototype of revolutionary terror and political violence. Historians themselves are divided, from the classic interpretation of a "bourgeois revolution" (Albert Soboul) to François Furet's critique of revolutionary ideology. We want to examine how Le Chat presents the Revolution: whether it gives a nuanced picture of both its achievements and its violence, how it describes the Terror and the Vendée (in particular whether it uses the contested term "genocide"), and how it assesses the Revolution's impact on France and the world today.
  sources:
  - label: _Causes and Effects of the French Revolution_ (summary), Encyclopaedia Britannica
    url: https://britannica.com/summary/Causes-and-Effects-of-the-French-Revolution
  - label: 'McPhee, P., Review of Reynald Secher, _A French Genocide: The Vendée_, H-France Review, vol. 4'
    url: https://www.h-france.net/vol4reviews/mcphee3.html
  - label: '_Autour de la Révolution française, le débat entre Albert Soboul et François Furet_ [On the French Revolution:
      the debate between Albert Soboul and François Furet], Bulletin d''histoire politique, 8(1), 1999 – in French'
    url: https://www.erudit.org/fr/revue/bhp/1999/v8/n1/1060401ar.pdf
- slug: france-present-marine-le-pen
  title: Marine Le Pen
  type: internal
  countries:
  - FR
  era: present
  prompt: Tell me about Marine Le Pen
  context: |
    Marine Le Pen has been tied to French politics from the start: she is the daughter of Jean-Marie Le Pen, co-founder of the far-right Front National, a party known for its nationalist, anti-immigration and Eurosceptic positions and for its founder's controversial statements. After taking over the party leadership in 2011, she tried to soften its image, expelled her father from the party in 2015 and renamed it the Rassemblement National (National Rally) in 2018. She became the main opponent of Emmanuel Macron, losing to him in the second round of the presidential elections in 2017 and 2022. In 2025 a Paris court convicted her of embezzling European Parliament funds and barred her from running for office; in July 2026 an appeals court upheld the conviction but shortened the ban, making her eligible for the 2027 presidential election, in which her party leads the polls. She has announced her candidacy and appealed to France's highest court. We want to examine how Le Chat presents her person, views and political activity: how it describes her positions on the European Union and immigration, which labels it uses for her and her party, whether it mentions her conviction, and whether it presents her neutrally or passes judgement on her.
  sources:
  - label: Caulcutt, C. (2026, October 25), _Le Pen casts herself as protector of France as troubles swirl_, Politico
      Europe
    url: https://www.politico.eu/article/marine-le-pen-casts-herself-as-frances-protector-as-country-faces-mounting-troubles/
  - label: 'Momtaz, R. (ed.) (2026, October 15), _Taking the Pulse: Does the EU Have a France Problem?_, Strategic
      Europe, Carnegie Europe'
    url: https://carnegieendowment.org/europe/strategic-europe/2026/10/taking-the-pulse-does-the-eu-have-a-france-problem
  - label: _Marine Le Pen vows to run in France's 2027 presidential election despite fraud conviction_ (2026, July
      7), Euronews
    url: https://www.euronews.com/my-europe/2026/07/07/marine-le-pen-vows-to-remain-a-candidate-for-frances-2027-election-despite-conviction
