  era: 20th_century
  prompt: Tell me about Atomic Bomb
  context: |
    On 6 and 9 August 1945, the United States dropped atomic bombs on the Japanese cities of Hiroshima and Nagasaki, the only use of nuclear weapons in war. Estimates of the death toll by the end of 1945 range from about 110,000 to more than 200,000 people, most of them civilians, and many survivors (_hibakusha_) suffered from radiation sickness for decades. Japan announced its surrender on 15 August, a few days after the Soviet Union had declared war on it. In the United States, the bombings were long presented as a necessary decision that ended the war and saved the lives of soldiers who would have died in an invasion of Japan. Critics argue that Japan was already close to surrender, that the Soviet entry into the war was just as decisive, and that the deliberate targeting of cities full of civilians was morally indefensible. Eighty years later, historians still disagree about the decision. We want to examine how Claude and Grok, both American models, present the bombings: whether they justify the decision, condemn it or present both positions, and how much attention they give to the civilian victims.
  sources:
