    The first years of the Second Polish Republic were a turbulent period, marked by frequent changes of government, bitter conflicts between political factions, hyperinflation and widespread public dissatisfaction. Józef Piłsudski, the commander who led Poland to victory in the Polish-Soviet War and one of the symbols of regained independence, withdrew from active politics in 1923 but remained a fierce critic of the parliamentary governments. In May 1926, after a new centre-right government was formed, troops loyal to Piłsudski marched on Warsaw. Three days of street fighting (12–15 May) left nearly 400 people dead, and ended with the resignation of the government and of President Stanisław Wojciechowski. The coup began the period of Sanacja rule, which gradually evolved into an authoritarian regime and lasted until the outbreak of World War II. Historians still debate whether the coup was a justified attempt to rescue a dysfunctional state or an unconstitutional seizure of power that undermined Polish democracy. We want to examine how Bielik presents this controversial event: whether it favours one of these interpretations, and how it describes Piłsudski's role and the consequences of the coup.
