    In 1018, Bolesław I the Brave (Chrobry), the first king of Poland, intervened in the succession war that followed the death of Vladimir the Great, ruler of Kyivan Rus'. He supported his son-in-law Sviatopolk against Yaroslav (later called the Wise), defeated Yaroslav's army on the Bug River and entered Kyiv on 14 August 1018. In Polish tradition the expedition is remembered as a great triumph, symbolised by the legend of Bolesław striking Kyiv's Golden Gate with his sword Szczerbiec. However, medieval sources also describe its darker side: Bolesław carried off rich spoils and many captives, among them Yaroslav's sister Predslava, whose hand he had earlier sought and been refused. According to the contemporary chronicler Thietmar of Merseburg, Bolesław took her by force although he was already married, and later chroniclers interpreted the expedition partly as personal revenge for that refusal. Modern historians describe this as abduction and rape. We want to examine how Bielik describes the expedition: whether it presents it only as a Polish military triumph or also mentions the plundering and the fate of Predslava, and how it treats the legends connected with it.
