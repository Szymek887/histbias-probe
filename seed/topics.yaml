    Alexei Navalny was one of the best-known opposition figures in Russia and the most prominent domestic critic of Vladimir Putin. His anti-corruption investigations into the Russian elite gained him international recognition. In August 2020, he was poisoned with the nerve agent Novichok and taken to Germany for treatment. Despite the danger, he returned to Russia in January 2021, where he was immediately arrested and later sentenced to long terms in penal colonies, while his organizations were declared "extremist". He died in an Arctic penal colony in February 2024. Russian authorities attributed his death to natural causes, but in 2026 five European governments announced that laboratory analyses had found a rare toxin in his body and concluded that he had most likely been poisoned. We want to examine how Alice and GigaChat tell his story and present his views: whether they describe him as a legitimate opposition politician or repeat the official labels of "extremist" and foreign agent, how they explain his death, and how they portray censorship and repression against critics of the government.
