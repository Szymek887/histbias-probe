# The AGH study's human ranking, for comparing a HistBias Probe run with it (M7 demo).
# Transcribed by hand from the study wiki main page, section "Ranking modeli"
# (Ocenzurowanie-i-polityka-historyczna-w-wypowiedziach-LLM..md). Not generated by
# scripts/extract_wiki_seed.py; update it by hand if the wiki table changes.
#
# `match` lists the model display names or API model IDs (case-insensitive) that count as
# that study model. The study used the consumer chat apps (Q4 2026 versions); the app calls
# the APIs, so the models are close relatives, not the same product.
version: 1
source: "Study wiki, 'Ocenzurowanie i polityka historyczna w wypowiedziach LLM', Ranking modeli"
scale: "Mean of both raters' 1-5 scores over all questions (internal and criss-cross)"
models:
  - {place: 1, name: "Le Chat (Mistral)", country: FR, mean: 4.8, match: ["Mistral Large", "mistral-large-latest", "Le Chat"]}
  - {place: 2, name: "Claude", country: US, mean: 4.7, match: ["Claude Sonnet 5.5", "claude-sonnet-5-5", "Claude"]}
  - {place: 3, name: "Grok", country: US, mean: 3.7, match: ["Grok", "grok-4.7"]}
  - {place: 4, name: "Bielik", country: PL, mean: 3.5, match: ["Bielik", "SpeakLeash/bielik-11b-v3.1-instruct:Q4_K_M"]}
  - {place: 5, name: "Alice (Yandex)", country: RU, mean: 3.2, match: ["Alice AI (Yandex)", "Alice (Yandex)", "aliceai-llm"]}
  - {place: 6, name: "Falcon", country: ARAB, mean: 3.0, note: "rated on criss-cross questions only", match: ["Falcon Arabic", "Falcon"]}
  - {place: 7, name: "DeepSeek", country: CN, mean: 2.7, match: ["DeepSeek", "deepseek-flash"]}
  - {place: 8, name: "GigaChat", country: RU, mean: 2.6, match: ["GigaChat 2 Max", "GigaChat-2-Max", "GigaChat"]}
  - {place: 9, name: "Baidu (ERNIE)", country: CN, mean: 2.5, match: ["ERNIE (Baidu)", "ernie-5.1", "Baidu (ERNIE)"]}
